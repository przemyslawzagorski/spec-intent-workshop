# Pelne uruchomienie end-to-end: oba serwisy, Postgres i Kafka.
#
# UWAGA - to NIE jest potrzebne do testow.
#
# Testy Javy stawiaja Postgresa same przez Quarkus Dev Services, a testy
# workera nie potrzebuja ani bazy, ani brokera, bo regula jest czysta funkcja.
# Ten plik sluzy do OGLADANIA calosci, nie do bramki.
#
# To rozroznienie jest czescia lekcji: jesli twoja bramka wymaga postawienia
# calego systemu, to nie jest bramka - to jest srodowisko.
#
#   docker compose up --build
#   curl -s localhost:8080/q/health/ready
#   curl -s localhost:8000/q/health/ready

name: spec-intent-workshop

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: returns
      POSTGRES_USER: returns
      POSTGRES_PASSWORD: returns
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returns"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Redpanda zamiast Kafki: ten sam protokol, jeden proces, startuje w sekundy.
  # Liczy sie czas petli zwrotnej: broker, ktory wstaje minute,
  # zjada wiecej czasu niz sam test.
  kafka:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  returns-service:
    build:
      context: ./returns-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/returns
      QUARKUS_DATASOURCE_USERNAME: returns
      QUARKUS_DATASOURCE_PASSWORD: returns
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POLICY_FILE: /work/return-policy.yaml
    volumes:
      - ./return-policy.yaml:/work/return-policy.yaml:ro
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }

  scoring-worker:
    build: ./scoring-worker
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      POLICY_FILE: /work/return-policy.yaml
    volumes:
      - ./return-policy.yaml:/work/return-policy.yaml:ro
    ports: ["8000:8000"]
    depends_on:
      kafka: { condition: service_healthy }
