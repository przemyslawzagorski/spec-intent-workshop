[project]
name = "scoring-worker"
version = "2026.0.0"
description = "Liczy wskaznik naduzyc dla zwrotow. Drugi serwis, drugi jezyk, ten sam wzorzec."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6",
    "aiokafka>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
