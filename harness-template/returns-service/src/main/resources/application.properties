# Polityka zwrotow. Domyslnie z katalogu nadrzednego (reference/return-policy.yaml),
# a gdy go nie ma - z classpath. Uczestnik warsztatu podmienia ten plik na swoj.
policy.file=../return-policy.yaml

# PostgreSQL. Nie podajemy jdbc.url, wiec w trybie dev i test Quarkus uruchomi
# Dev Services: sam wstanie kontener Postgresa i wstrzyknie namiary.
# Na produkcji url przychodzi ze srodowiska.
quarkus.datasource.db-kind=postgresql

quarkus.log.category."workshop.rma".level=INFO

# --- szew asynchroniczny (docs/contract/events.md) ---
# W trybie dev i test Quarkus Dev Services postawi brokera sam, tak samo jak
# Postgresa. Na produkcji adres przychodzi ze srodowiska.
mp.messaging.outgoing.return-submitted.connector=smallrye-kafka
mp.messaging.outgoing.return-submitted.topic=return.submitted
mp.messaging.outgoing.return-submitted.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.return-scored.connector=smallrye-kafka
mp.messaging.incoming.return-scored.topic=return.scored
mp.messaging.incoming.return-scored.value.deserializer=workshop.rma.returns.boundary.ReturnScoredDeserializer
mp.messaging.incoming.return-scored.auto.offset.reset=earliest
