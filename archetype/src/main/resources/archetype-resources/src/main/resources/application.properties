#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
${symbol_pound} Polityka zwrotow. Domyslnie z katalogu nadrzednego (reference/return-policy.yaml),
${symbol_pound} a gdy go nie ma - z classpath. Uczestnik warsztatu podmienia ten plik na swoj.
policy.file=../return-policy.yaml

${symbol_pound} PostgreSQL. Nie podajemy jdbc.url, wiec w trybie dev i test Quarkus uruchomi
${symbol_pound} Dev Services: sam wstanie kontener Postgresa i wstrzyknie namiary.
${symbol_pound} Na produkcji url przychodzi ze srodowiska.
quarkus.datasource.db-kind=postgresql

quarkus.log.category."${package}".level=INFO
